#说说
#---start---
shuoshuo:
  use: 2 # 0关闭说说 1使用qexo说说 2使用主题说说
  qexo:
    url: https://qexo.blog.yizhixiaozhu.top #填写你qexo的地址
banner:
  enable: true
  # 卡片类型: intro, image, quote, link, stat
  # 卡片尺寸: hero, tall, wide, standard, compact, square (1x1), pill (3x1)
  # 语义色: surface, primary, secondary, tertiary
  cards:
    - type: intro
      size: hero
      tone: primary
      featured: true # 移动端顶部精选卡片，最多两张
      eyebrow: "Hexo Theme"
      icon: auto_awesome
      title: "Materialis"
      subtitle: "A Material Design 3 Expressive theme for Hexo."
      actions:
        - text: "浏览文章"
          icon: article
          url: "/diary/"
          variant: filled

    - type: image
      size: tall
      tone: surface
      featured: true
      image: "https://blog.yizhixiaozhu.top/image/10.webp"
      alt: "Materialis"
      fallback: "图片暂不可用"
      position: center
      title: "Materialis"
      description: "简洁、清晰、专注内容"
      url: "/about/"

    - type: link
      size: standard
      tone: secondary
      title: "关于本站"
      description: "了解 Materialis 主题"
      icon: info
      url: "/about/"

    - type: quote
      size: wide
      tone: tertiary
      source: hitokoto # static 或 hitokoto
      fallback: "保持简单，专注内容。"

    - type: link
      size: standard
      tone: secondary
      title: "GitHub"
      description: "查看主题源码"
      icon: code
      url: "https://github.com/Can1425/Hexo-Theme-Materialis"
      external: true

    - type: stat
      size: compact
      tone: surface
      source: posts # posts, categories, tags，也可以直接填写 value
      label: "文章"
      icon: description

    - type: stat
      size: square
      tone: secondary
      source: categories
      label: "分类"
      icon: category

    - type: stat
      size: square
      tone: tertiary
      source: tags
      label: "标签"
      icon: sell

    - type: link
      size: square
      tone: surface
      title: "文章归档"
      description: "浏览全部文章"
      icon: inventory_2
      url: "/diary/"

    - type: link
      size: square
      tone: primary
      title: "友情链接"
      description: "发现更多站点"
      icon: link
      url: "/links/"

    - type: link
      size: pill
      tone: primary
      title: "继续阅读"
      description: "浏览最新文章"
      icon: auto_stories
      url: "/diary/"

    - type: stat
      size: compact
      tone: surface
      source: tags
      label: "标签"
      icon: sell
#---end---
#纪念日设置
#---start---
memorial_days:
  enable: true  # 是否启用纪念日黑白效果
  dates:  # 纪念日日期列表 (月-日格式)
    - 7.7
    - 9.18
    - 12.13
#---end---
#链接拦截器
#---start---
interceptor:
  enable: flase  # 是否启用链接拦截器功能
#---end---
#音乐球
#---start---
music:
  enable: true  # 是否启用音乐球
  # 网易云音乐 API 地址（可选）
  # 留空：使用网易云官方外链播放音频（免后端），歌曲信息从下方 playlist 读取
  # 填写自建 NeteaseCloudMusicApi 地址（如 https://your-api.com）：自动拉取 playlist_id 歌单
  api: ""
  # 歌单 ID（仅在填写了 api 时生效，自动获取歌单内歌曲与封面）
  playlist_id: ""
  # 播放列表（api 为空时使用）。id 为网易云歌曲 ID，cover 留空则显示音符图标
  playlist:
    - id: 1824020871
      name: "起风了"
      artist: "买辣椒也用券"
      cover: ""
    - id: 28815250
      name: "Victory"
      artist: "Two Steps From Hell"
      cover: ""
#---end---
#AI 摘要
#---start---
ai_summary:
  enable: true  # 是否启用 AI 摘要功能
  # API 服务器地址（兼容 OpenAI 格式，如 https://api.openai.com/v1 或自建代理）
  server: "https://api.deepseek.com"
  # API Key（建议前端使用时注意安全性；也可通过自建服务反代）
  api_key: ""
  # 使用的模型名称（如 gpt-4o-mini, gpt-4o, deepseek-chat, qwen-plus 等）
  model: "deepseek-v4-flash"
  # 摘要长度（中文：约对应字数）
  max_tokens: 100
  # 温度参数：0~1，越大越有创造性
  temperature: 0.3
  # 自动生成：进入文章页自动调用，false 则显示"生成摘要"按钮让用户手动触发
  auto_generate: true
  # 允许的最大文章字数（超出则取前后段避免超限）
  max_article_length: 8000
#---end---
index_generator:
  path: ''
  per_page: 10
  order_by: -date
#date：按文章发布日期升序排列（从旧到新）
#-date：按文章发布日期降序排列（从新到旧）- 最常用
#updated：按文章更新日期升序排列
#-updated：按文章更新日期降序排列
#title：按文章标题字母顺序排列
#-title：按文章标题字母倒序排列
#random：随机排列
