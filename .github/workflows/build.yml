name: Hexo Theme Release

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: |
        npm install --ignore-scripts

    - name: Smart version management
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        echo "Commit: $COMMIT_MSG"
        
        # 获取 npm 上的最新版本
        LATEST_NPM_VERSION=$(npm view hexo-theme-materialis version 2>/dev/null || echo "0.0.0")
        echo "Latest version on npm: $LATEST_NPM_VERSION"
        
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        echo "Current version in repo: $CURRENT_VERSION"
        
        # 如果仓库版本比 npm 新，使用仓库版本
        if [ "$(printf '%s\n' "$LATEST_NPM_VERSION" "$CURRENT_VERSION" | sort -V | tail -n1)" = "$CURRENT_VERSION" ] && [ "$CURRENT_VERSION" != "$LATEST_NPM_VERSION" ]; then
          echo "✅ Using newer repo version: $CURRENT_VERSION"
          TARGET_VERSION="$CURRENT_VERSION"
        else
          # 基于 commit 类型决定版本更新
          if [[ "$COMMIT_MSG" =~ ^feat: ]]; then
            BUMP="minor"
            echo "Bump type: minor (feature)"
          else
            BUMP="patch"
            echo "Bump type: patch (fix/other)"
          fi
          
          # 手动计算新版本（不使用 npm version 的 JSON 输出）
          if [ "$BUMP" = "minor" ]; then
            MAJOR=$(echo $LATEST_NPM_VERSION | cut -d. -f1)
            MINOR=$(echo $LATEST_NPM_VERSION | cut -d. -f2)
            PATCH=0
            TARGET_VERSION="$MAJOR.$((MINOR + 1)).$PATCH"
          else
            MAJOR=$(echo $LATEST_NPM_VERSION | cut -d. -f1)
            MINOR=$(echo $LATEST_NPM_VERSION | cut -d. -f2)
            PATCH=$(echo $LATEST_NPM_VERSION | cut -d. -f3)
            TARGET_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          
          echo "Calculated new version: $TARGET_VERSION"
          
          # 更新 package.json
          npm version $TARGET_VERSION --no-git-tag-version --allow-same-version --ignore-scripts
        fi
        
        echo "Target version: $TARGET_VERSION"
        
        # 发布到 npm
        if npm view hexo-theme-materialis@$TARGET_VERSION version >/dev/null 2>&1; then
          echo "✅ Version $TARGET_VERSION already published, skipping"
        else
          echo "🚀 Publishing version $TARGET_VERSION to npm..."
          npm publish
          echo "✅ Successfully published to npm!"
        fi
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}