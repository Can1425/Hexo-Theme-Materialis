name: Hexo Theme Release

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: |
        npm install --ignore-scripts

    - name: Update version and publish
      run: |
        # 简单版本控制
        COMMIT_MSG=$(git log -1 --pretty=%B)
        echo "Commit: $COMMIT_MSG"
        
        if [[ "$COMMIT_MSG" =~ ^feat: ]]; then
          npm version minor --no-git-tag-version --ignore-scripts
        else
          npm version patch --no-git-tag-version --ignore-scripts
        fi
        
        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "Publishing version: $NEW_VERSION"
        
        # 发布到 npm - 自动跳过已发布版本
        if npm view hexo-theme-materialis@$NEW_VERSION version >/dev/null 2>&1; then
          echo "✅ Version $NEW_VERSION already published, skipping npm publish"
        else
          npm publish
          echo "✅ Successfully published to npm!"
        fi
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Create GitHub Release
      if: success()
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "🎉 Creating release for v$VERSION"
        
        gh release create "v$VERSION" \
          --title "Release v$VERSION" \
          --notes "Hexo Theme Materialis v$VERSION" \
          --draft=false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}